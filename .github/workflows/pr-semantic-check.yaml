name: PR Title Semantic Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    name: PR Title Check
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        with:
          # Custom list of allowed commit types
          types: |
            feat
            fix
            chore
            docs
            test
            refactor
            perf
          # Require a scope e.g., feat(api): ...
          requireScope: true
          # Allow WIP pull requests to pass if titled "WIP: ..."
          wip: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
