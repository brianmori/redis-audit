name: 🐛 Bug Report
description: Report broken functionality or unexpected behavior
title: "fix: "
labels: ["type: fix"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear summary of the bug.
      placeholder: What failed or behaved unexpectedly?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the bug.
      placeholder: |
        1. Run command '...'
        2. Pass flag '...'
        3. See error output
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What should have happened versus what actually occurred.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, CLI/runtime versions, architecture.
      placeholder: e.g. macOS Sonoma, Go 1.22, gh CLI v2.40.0
    validations:
      required: false

