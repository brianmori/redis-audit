[project]
name = "redis-audit"
version = "0.1.0"
description = "Redis auditing library and CLI"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "brianmori", email = "52781411+brianmori@users.noreply.github.com" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]

keywords = [
    "redis",
    "redis audit",
    "redis cluster",
    "redis sentinel",
    "redis migration",
]

requires-python = ">=3.12"

dependencies = [
    "redis>=8.1,<9",
    "pydantic>=2.13,<3"
]

[project.urls]
Homepage = "https://github.com/brianmori/redis-audit"
Documentation = "https://github.com/brianmori/redis-audit"
Repository = "https://github.com/brianmori/redis-audit"
Issues = "https://github.com/brianmori/redis-audit/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-dotenv>=0.5.0,<1.0.0",
    "ruff>=0.15,<1",
    "mypy>=2.3.1,<3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking  — moves pure-annotation imports into TYPE_CHECKING blocks
    "ANN", # flake8-annotations     — enforces type hint coverage
    "PTH", # flake8-use-pathlib     — prefers pathlib over os.path
    "RUF", # ruff-specific rules
    "PL", # pylint
    "TID", # flake8-tidy-imports
    "D", # pydocstyle
]

ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package (__init__.py)
    "D107", # Missing docstring in __init__
    "D203", # 1 blank line required before class docstring (conflicts with D211)
    "D213", # Multi-line docstring summary should start at the second line (conflicts with D212)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["redis_audit"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",        # Ignore docstring requirements in tests
    "PLR2004",  # Allow magic values in assertions (e.g., assert result == 42)
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests with mocked HTTP (fast, no real I/O)",
    "live: Live tests against real redis instances (slow, requires Docker)",
]
env_files = [".env"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "conftest"
ignore_missing_imports = true
